name: Build WASI MCP

on:
  workflow_dispatch:
  push:
    branches:
      - wasi-*

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-wasi:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # v1.95.0
        with:
          target: 1.95.0
          targets: wasm32-wasip1

      - name: Build WASI module
        run: cargo build --release --target wasm32-wasip1

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp target/wasm32-wasip1/release/altium-designer-mcp.wasm dist/
          sha256sum dist/altium-designer-mcp.wasm > dist/SHA256SUMS.txt

      - name: Upload WASI module
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: altium-designer-mcp-wasi
          path: dist/
          retention-days: 7
